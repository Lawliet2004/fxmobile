name: FxMobile Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host CLI (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            asset: fxengine-linux-x64
            bin: fxengine
          - os: windows-latest
            asset: fxengine-windows-x64.exe
            bin: fxengine.exe
          - os: macos-latest
            asset: fxengine-macos-x64
            bin: fxengine

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Test fxengine
        run: cargo test --manifest-path native/fxengine/Cargo.toml

      - name: Build host CLI
        run: cargo build --release --bin fxengine --manifest-path native/fxengine/Cargo.toml

      - name: Stage named artifact
        shell: bash
        run: |
          mkdir -p dist
          src="native/fxengine/target/release/${{ matrix.bin }}"
          dst="dist/${{ matrix.asset }}"
          cp "$src" "$dst"
          chmod +x "$dst"
          ls -lh "$dst"
          ./"$dst" --help
          ./"$dst" --version
          ./"$dst" --smoke

      - name: Upload host binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  android:
    name: Build Release APKs & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Install Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Release APKs
        run: ./gradlew assembleRelease

      - name: Build Release AAB
        run: ./gradlew :app:bundleRelease

      - name: Capture version name
        id: version
        run: |
          VERSION=$(./gradlew -q :app:properties | grep '^versionName' | awk '{print $2}' | tr -d '\r')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version captured: $VERSION"

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/*.apk release-artifacts/ || true
          cp app/build/outputs/bundle/release/*.aab release-artifacts/ || true
          if [ -d "install" ]; then
            cp install/*.apk release-artifacts/ || true
          fi
          # Rename R8 mapping file with version for easier upload.
          if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
            cp app/build/outputs/mapping/release/mapping.txt \
               "release-artifacts/mapping-${{ steps.version.outputs.version }}.txt" || true
          fi
          ls -la release-artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: release-artifacts/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: aab
          path: release-artifacts/*.aab
          if-no-files-found: warn

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: mapping
          path: release-artifacts/mapping-*.txt
          if-no-files-found: warn

  release:
    name: Build & Publish Release
    needs: [host, android]
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-artifacts

      - name: List artifacts
        run: ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

