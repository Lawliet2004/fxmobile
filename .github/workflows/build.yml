name: FxMobile CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 'latest'

      - name: Install NDK & CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Install Rust (host + Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Run Rust DSP test suite
        run: cargo test --manifest-path native/fxengine/Cargo.toml --offline || cargo test --manifest-path native/fxengine/Cargo.toml

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Run Android Unit Tests
        run: ./gradlew test

      - name: Android Lint
        run: ./gradlew lint

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Inspect & Report APK Binary Footprint
        run: |
          echo "=== APK SIZE REPORT ==="
          ls -lh app/build/outputs/apk/release/
